<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 100" fill="none">
  <!--
    Tip: رنگ کل لوگو از currentColor میاد.
    در Light:  .logo { color:#cfcfcf; }
    در Dark:   .dark .logo { color:#ffffff; }  یا هر رنگ دلخواه
  -->

  <g stroke="#8fc3ff" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left lens / eye -->
    <ellipse cx="62" cy="50" rx="44" ry="34" stroke-width="4" opacity="0.9"></ellipse>
    <ellipse cx="62" cy="50" rx="38" ry="28" stroke-width="2.5" opacity="0.7"></ellipse>
    <path d="M21 35 C28 18, 45 10, 62 10 C79 10, 96 18, 103 35" stroke-width="3" opacity="0.45"></path>
    <path d="M21 65 C28 82, 45 90, 62 90 C79 90, 96 82, 103 65" stroke-width="3" opacity="0.45"></path>

    <!-- decorative ticks -->
    <path d="M14 50 h-10" stroke-width="3" opacity="0.35"></path>
    <path d="M110 50 h10" stroke-width="3" opacity="0.35"></path>

    <!-- Left small dots -->
    <circle cx="34" cy="18" r="3" fill="#8fc3ff" opacity="0.35" stroke="none"></circle>
    <circle cx="22" cy="30" r="2.5" fill="#8fc3ff" opacity="0.25" stroke="none"></circle>
    <circle cx="26" cy="78" r="3" fill="#8fc3ff" opacity="0.35" stroke="none"></circle>
    <circle cx="40" cy="86" r="2.5" fill="#8fc3ff" opacity="0.25" stroke="none"></circle>

    <!-- Right lens / eye -->
    <ellipse cx="184" cy="50" rx="44" ry="34" stroke-width="4" opacity="0.9"></ellipse>
    <ellipse cx="184" cy="50" rx="38" ry="28" stroke-width="2.5" opacity="0.7"></ellipse>
    <path d="M143 35 C150 18, 167 10, 184 10 C201 10, 218 18, 225 35" stroke-width="3" opacity="0.45"></path>
    <path d="M143 65 C150 82, 167 90, 184 90 C201 90, 218 82, 225 65" stroke-width="3" opacity="0.45"></path>

    <!-- decorative ticks -->
    <path d="M136 50 h-10" stroke-width="3" opacity="0.35"></path>
    <path d="M232 50 h10" stroke-width="3" opacity="0.35"></path>

    <!-- Right small dots -->
    <circle cx="212" cy="18" r="3" fill="#8fc3ff" opacity="0.35" stroke="none"></circle>
    <circle cx="224" cy="30" r="2.5" fill="#8fc3ff" opacity="0.25" stroke="none"></circle>
    <circle cx="220" cy="78" r="3" fill="#8fc3ff" opacity="0.35" stroke="none"></circle>
    <circle cx="206" cy="86" r="2.5" fill="#8fc3ff" opacity="0.25" stroke="none"></circle>

    <!-- Center bridge dots -->
    <circle cx="123" cy="26" r="3" fill="#8fc3ff" opacity="0.35" stroke="none"></circle>
    <circle cx="123" cy="74" r="3" fill="#8fc3ff" opacity="0.35" stroke="none"></circle>

    <!-- tiny accent dots near center (like original) -->
    <circle cx="136" cy="26" r="2.8" fill="#8fc3ff" opacity="0.25" stroke="none"></circle>
    <circle cx="110" cy="26" r="2.8" fill="#8fc3ff" opacity="0.25" stroke="none"></circle>
  </g>
  <g stroke="#111111" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- "o" -->
    <ellipse cx="104" cy="60" rx="14" ry="18" stroke-width="6" opacity="0.95"></ellipse>

    <!-- "u" -->
    <path d="M128 40 v24
             c0 10 8 18 18 18
             s18-8 18-18
             V44" stroke-width="6" opacity="0.95"></path>
  </g>
</svg>
